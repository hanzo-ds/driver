version: '3'

services:
  datastore-server:
    image: "$ORG/datastore-server:$VERSION"
    container_name: test-datastore-server
    environment:
      - TZ=Europe/Moscow
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9440:9440"
    volumes:
      - "./datastore_server_config/$TOP_LEVEL.xml:/etc/datastore-server/config.d/test_config.xml"
      - "./datastore_server_config/certs:/etc/datastore-server/certs"

  datastore-client:
    image: "$ORG/datastore-server:$VERSION"
    container_name: test-datastore-client
    entrypoint: /bin/sh
    command: [-c, 'while :; do sleep 1; done']
